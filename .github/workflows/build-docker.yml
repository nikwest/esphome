name: Build Docker Image

on:
  push:
    branches:
      - esphome_build_server
    paths:
      - "docker/**"
      - ".github/workflows/build-docker.yml"
      - "esphome/**"
      - "requirements*.txt"
      - "platformio.ini"
      - "script/platformio_install_deps.py"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish (for example: remote-build)"
        required: true
        default: "remote-build"
      push_image:
        description: "Push image to GHCR"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build remote build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.push_image }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/esphome"
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'remote-build' }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          PUSH_IMAGE="${{ github.event_name == 'push' || inputs.push_image }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${TAG},${IMAGE}:${TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "push_image=${PUSH_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and optionally push
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          target: final
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BUILD_TYPE=docker
            BUILD_OS=debian

      - name: Summary
        run: |
          echo "Image: ${{ steps.meta.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: ${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed: ${{ steps.meta.outputs.push_image }}" >> "$GITHUB_STEP_SUMMARY"
